# ci simple del proyecto turnos reservas
# corre en cada push a main y en cada pull request
name: ci

on:
  push:
    branches: [main]
  pull_request:

# permisos minimos solo para leer el codigo
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    # mysql real porque los tests de concurrencia usan bloqueo de filas
    # sqlite no lo soporta y daria resultados falsos
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: turnos_reservas_test
        ports:
          - 3306:3306
        # espera a que mysql este listo antes de seguir
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    # estas variables tienen prioridad sobre las de phpunit xml
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: turnos_reservas_test
      DB_USERNAME: root
      DB_PASSWORD: secret

    steps:
      # baja el codigo del repositorio
      - uses: actions/checkout@v4

      # misma version de php que usa sail en desarrollo
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, pdo_mysql
          coverage: none

        # corta el pipeline si php es anterior al parche de php2shell
      - name: verificar version minima de php
        run: |
          php -r 'exit(version_compare(PHP_VERSION, "8.5.12", ">=") ? 0 : 1);'

      # node para compilar el frontend vue
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: instalar dependencias php
        run: composer install --no-interaction --prefer-dist

      - name: preparar entorno de laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      # inertia necesita los assets compilados para los tests
      - name: instalar y compilar frontend
        run: |
          npm ci
          npm run build

      # revisa el estilo del codigo sin modificarlo
      - name: estilo con pint
        run: ./vendor/bin/pint --test

      # busca errores de tipos y logica sin ejecutar el codigo
      - name: analisis estatico con phpstan
        run: ./vendor/bin/phpstan analyse --memory-limit=1G

      # corre todos los tests
      - name: tests con pest
        run: ./vendor/bin/pest
